# Deploys the Admin Web portal to the mindmate-staging live channel.
# The deploy credential is an environment secret of "staging" (main only).
#
# Runs only after "Verify Android flavors" (analyzer, the full Flutter suite and
# the Functions emulator suite) has passed for a push to main, so the deployed
# commit is exactly the verified one. Deploys Hosting only: never Functions,
# Firestore rules or Storage rules, and never production.
# test/tooling/hosting_deploy_targets_test.dart guards those boundaries.

name: Deploy staging Firebase Hosting on merge
on:
  workflow_run:
    workflows: ["Verify Android flavors"]
    types: [completed]
    branches: [main]
  # Manual redeploy of the current main HEAD (for example after a fixed flaky
  # check). Rollback to an older release is done from the Firebase console.
  workflow_dispatch:

permissions:
  contents: read
  # The manual-run gate queries Actions runs.
  actions: read

# Serialize live deploys. A run that is already deploying finishes; an older
# queued run is replaced by the newer one.
concurrency:
  group: hosting-staging-live
  cancel-in-progress: false

env:
  PROJECT_ID: mindmate-staging
  FIREBASE_TOOLS_VERSION: 15.29.0
  # Holds roles/firebasehosting.admin on mindmate-staging only.
  DEPLOYER: github-hosting-deployer@mindmate-staging.iam.gserviceaccount.com
  # reCAPTCHA Enterprise site key registered in App Check for the staging web
  # app ("MindMate Admin - Staging"). Site keys are public. Its allowed domains
  # are mindmate-staging.web.app, paaccmindmate.com and www.paaccmindmate.com.
  STAGING_RECAPTCHA_SITE_KEY: 6Le17JgtAAAAACbHth-LPHcS_P2n4ejBuddUYReM
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build_and_deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      # workflow_run already proves this; a manual run must prove it too.
      - name: Require a successful "Verify Android flavors" run for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-verify.yml/runs?head_sha=${DEPLOY_SHA}&event=push&status=success" --jq .total_count)"
          [[ "$passed" -gt 0 ]] || { echo "::error::$DEPLOY_SHA has no successful Verify Android flavors run on main."; exit 1; }
      - run: flutter pub get
      - name: Build staging admin web portal
        run: flutter build web --release --target lib/admin_main.dart --dart-define=APP_ENV=staging --dart-define=ENABLE_STAGING_APP_CHECK=true --dart-define=RECAPTCHA_ENTERPRISE_SITE_KEY=$STAGING_RECAPTCHA_SITE_KEY
      - name: Verify the bundle targets mindmate-staging
        run: bash ci/verify_staging_web_bundle.sh build/web "$STAGING_RECAPTCHA_SITE_KEY"
      - name: Verify the deploy credential and its actual IAM permissions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINDMATE_STAGING }}
        run: bash ci/verify_hosting_deployer.sh "$PROJECT_ID" "$DEPLOYER"
      # Checked last so the window for a newer merge is as small as possible.
      # That newer commit deploys through its own run once it is verified.
      - name: Skip unless this commit is still the head of main
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$head" == "$DEPLOY_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved from $DEPLOY_SHA to $head; not deploying a stale build."
          fi
      # v0.11.0. For channelId live this runs `firebase deploy --only hosting`.
      - if: steps.freshness.outputs.current == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINDMATE_STAGING }}
          projectId: mindmate-staging
          channelId: live
          firebaseToolsVersion: ${{ env.FIREBASE_TOOLS_VERSION }}

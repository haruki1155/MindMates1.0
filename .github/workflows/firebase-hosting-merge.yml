name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/app_bootstrap_test.dart
      - name: Build admin web portal
        run: flutter build web --release --target lib/admin_main.dart --dart-define=APP_ENV=production --dart-define=RECAPTCHA_V3_SITE_KEY=${{ secrets.RECAPTCHA_V3_SITE_KEY }}
      - name: Verify Firebase Hosting service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIND_MATES_CD2CF || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT')
          if not raw:
              sys.exit('Set FIREBASE_SERVICE_ACCOUNT_MIND_MATES_CD2CF to the production Firebase service account JSON in GitHub Actions secrets.')
          try:
              account = json.loads(raw)
          except json.JSONDecodeError:
              sys.exit('The Firebase Hosting service account secret must contain valid JSON.')
          if account.get('type') != 'service_account' or account.get('project_id') != 'mind-mates-cd2cf':
              sys.exit('The Firebase Hosting service account must belong to project mind-mates-cd2cf.')
          if not account.get('client_email') or not account.get('private_key'):
              sys.exit('The Firebase Hosting service account secret must contain the full JSON key.')
          PY
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIND_MATES_CD2CF || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: mind-mates-cd2cf

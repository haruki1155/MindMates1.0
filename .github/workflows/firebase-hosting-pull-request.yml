name: Deploy staging Firebase Hosting preview on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/app_bootstrap_test.dart
      - name: Build staging admin web portal
        run: flutter build web --release --target lib/admin_main.dart --dart-define=APP_ENV=staging --dart-define=RECAPTCHA_V3_SITE_KEY=${{ secrets.RECAPTCHA_V3_SITE_KEY_STAGING }}
      - name: Verify staging Firebase Hosting service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINDMATE_STAGING }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT')
          if not raw:
              sys.exit('Set FIREBASE_SERVICE_ACCOUNT_MINDMATE_STAGING to the staging Firebase service account JSON in GitHub Actions secrets.')
          try:
              account = json.loads(raw)
          except json.JSONDecodeError:
              sys.exit('The Firebase Hosting service account secret must contain valid JSON.')
          if account.get('type') != 'service_account' or account.get('project_id') != 'mindmate-staging':
              sys.exit('The Firebase Hosting service account must belong to project mindmate-staging.')
          if not account.get('client_email') or not account.get('private_key'):
              sys.exit('The Firebase Hosting service account secret must contain the full JSON key.')
          PY
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINDMATE_STAGING }}
          projectId: mindmate-staging

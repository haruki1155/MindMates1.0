# Staging-only PR previews for the Admin Web portal.
#
# Analyzer, the full Flutter suite and the Functions emulator suite already run
# on every PR in android-verify.yml, so they are not repeated here.
# Previews always target mindmate-staging; production is never reachable from
# this workflow. test/tooling/hosting_deploy_targets_test.dart guards that.

name: Deploy staging Firebase Hosting preview on PR
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read

# One preview channel per PR: a newer commit cancels the older run, so a slower
# stale build can never overwrite a newer preview.
concurrency:
  group: hosting-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PROJECT_ID: mindmate-staging
  CHANNEL_ID: pr-${{ github.event.pull_request.number }}
  FIREBASE_TOOLS_VERSION: 15.29.0
  # Holds roles/firebasehosting.admin on mindmate-staging only.
  DEPLOYER: github-hosting-deployer@mindmate-staging.iam.gserviceaccount.com

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      # Staging web builds keep App Check off (ENABLE_STAGING_APP_CHECK is not
      # set): preview hostnames are not on the staging reCAPTCHA key's
      # allowlist, so App Check-protected callables are not testable here.
      - name: Build staging admin web portal
        run: flutter build web --release --target lib/admin_main.dart --dart-define=APP_ENV=staging
      - name: Verify the bundle targets mindmate-staging
        run: bash ci/verify_staging_web_bundle.sh build/web
      - uses: actions/upload-artifact@v4
        with:
          name: admin-web-staging
          path: build/web
          retention-days: 1
          if-no-files-found: error

  deploy_preview:
    needs: build
    # Secrets are only exposed to branches of this repository. Fork and
    # Dependabot PRs still get the credential-free build above.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: admin-web-staging
          path: build/web
      - name: Verify staging Firebase Hosting service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINDMATE_STAGING }}
        run: python3 ci/verify_hosting_service_account.py "$PROJECT_ID" "$DEPLOYER"
      # v0.11.0. The action comments the preview URL, commit and expiry on the
      # PR and updates that comment on each new commit.
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINDMATE_STAGING }}
          projectId: mindmate-staging
          channelId: ${{ env.CHANNEL_ID }}
          expires: 7d
          firebaseToolsVersion: ${{ env.FIREBASE_TOOLS_VERSION }}

  cleanup_preview:
    # The 7-day expiry remains the fallback if this job fails.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Run from the base branch, not the closed PR's code.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Verify staging Firebase Hosting service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINDMATE_STAGING }}
        run: python3 ci/verify_hosting_service_account.py "$PROJECT_ID" "$DEPLOYER"
      - name: Delete this PR's preview channel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINDMATE_STAGING }}
        run: |
          set -euo pipefail
          # Never anything but pr-<number>; in particular never the live channel.
          [[ "$CHANNEL_ID" =~ ^pr-[0-9]+$ ]] || { echo "::error::Refusing to delete channel '$CHANNEL_ID'."; exit 1; }
          key="$RUNNER_TEMP/sa.json"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key")
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          # A PR closed before its preview deployed has no channel; that is fine.
          npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" hosting:channel:delete "$CHANNEL_ID" \
            --project "$PROJECT_ID" --force \
            || echo "::warning::Preview channel $CHANNEL_ID was not deleted (it may not exist); it expires within 7 days."

# Builds the staging Admin Web bundle for a PR. No secrets, no deployment.
#
# firebase-hosting-preview-deploy.yml deploys this artifact once this build
# and "Verify Android flavors" have both succeeded for the PR's current head
# commit. Analyzer, the full Flutter suite and the Functions emulator suite run
# in android-verify.yml and are not repeated here.

name: Build staging Admin Web preview
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer commit cancels the PR's older build.
concurrency:
  group: hosting-preview-build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Test the preview deploy gate
        run: python3 ci/preview_deploy_gate_test.py
      - run: flutter pub get
      # Previews keep App Check off: preview hostnames are not on the staging
      # reCAPTCHA key's allowlist, so they are limited to UI testing.
      - name: Build staging admin web portal
        run: flutter build web --release --target lib/admin_main.dart --dart-define=APP_ENV=staging
      - name: Verify the bundle carries the mindmate-staging config
        run: bash ci/verify_staging_web_bundle.sh build/web
      - uses: actions/upload-artifact@v4
        with:
          name: admin-web-staging
          path: build/web
          retention-days: 7
          if-no-files-found: error

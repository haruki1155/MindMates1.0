name: Deploy production Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Confirm production Hosting deployment
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: hosting-production-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    # Manual, confirmed, from main only, and gated by the production environment.
    if: ${{ inputs.confirm_production_deploy && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/app_bootstrap_test.dart
      - name: Build production admin web portal
        run: flutter build web --release --target lib/admin_main.dart --dart-define=APP_ENV=production --dart-define=RECAPTCHA_V3_SITE_KEY=${{ secrets.RECAPTCHA_V3_SITE_KEY }}
      # Blocked until a dedicated, Hosting-only production deployer exists: no
      # fallback to any generic or broader credential.
      - name: Verify the deploy credential and its actual IAM permissions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIND_MATES_CD2CF }}
        run: bash ci/verify_hosting_deployer.sh mind-mates-cd2cf github-hosting-deployer@mind-mates-cd2cf.iam.gserviceaccount.com
      # v0.11.0
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIND_MATES_CD2CF }}
          channelId: live
          projectId: mind-mates-cd2cf
          firebaseToolsVersion: 15.29.0

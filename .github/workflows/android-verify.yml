name: Verify Android flavors

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_production_release:
        description: Build the signed production release (requires signing secrets)
        required: false
        type: boolean
        default: false

jobs:
  staging-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - name: Use runner CMake
        shell: bash
        run: |
          cmake_bin="$(command -v cmake)"
          cmake_root="$(dirname "$(dirname "$(readlink -f "$cmake_bin")")")"
          test -x "$cmake_root/bin/cmake"
          sed -i '/^cmake\.dir=/d' android/local.properties 2>/dev/null || true
          printf 'cmake.dir=%s\n' "$cmake_root" >> android/local.properties
          "$cmake_root/bin/cmake" --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=APP_ENV=staging
      # Mood V2 presentation and the five readers default to on in staging
      # builds. This second, focused run proves the default-disabled shape
      # still holds, so neither configuration can hide a regression in the
      # other. It is scoped to the mood suites because other suites in this
      # repo do not currently pass under APP_ENV=development.
      - name: Verify Mood V2 default-disabled flags
        run: flutter test test/features/mood --dart-define=APP_ENV=development
      - run: flutter clean
      - run: flutter build apk --debug --flavor staging --dart-define=APP_ENV=staging
      - name: Verify staging APK identity and permissions
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location is unavailable}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump badging build/app/outputs/flutter-apk/app-staging-debug.apk | grep "package: name='com.example.mind_mates.staging'"
          "$aapt" dump permissions build/app/outputs/flutter-apk/app-staging-debug.apk | grep 'android.permission.INTERNET'

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # 21 of the 40 suites drive a real Firestore/Auth emulator and assert
      # on the deployed rules and callables. Without one they fail outright
      # rather than skipping, so this job ran red and gated nothing. The whole
      # suite now runs inside the emulator: no file list to keep in sync, and
      # a new emulator-backed test cannot silently stop running.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Functions and a local Firebase CLI
        run: |
          npm ci --prefix functions
          npm install --prefix "$RUNNER_TEMP/fn-firebase-tools" --no-save firebase-tools@15.29.0
      - name: Prepare an isolated, credential-free test environment
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP/fn-firebase-home" "$RUNNER_TEMP/fn-empty-gcloud"
          chmod 700 "$RUNNER_TEMP/fn-firebase-home" "$RUNNER_TEMP/fn-empty-gcloud"
          {
            echo "HOME=$RUNNER_TEMP/fn-firebase-home"
            echo "CLOUDSDK_CONFIG=$RUNNER_TEMP/fn-empty-gcloud"
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "FIREBASE_TOKEN="
            echo "MOOD_V2_STAGING_PILOT_UIDS="
            echo "SUPER_ADMIN_UID=functions-ci-super-admin"
          } >> "$GITHUB_ENV"
      - run: npm run build --prefix functions
      - name: Provide the synthetic parameter the emulator needs to discover functions
        shell: bash
        run: |
          set -euo pipefail
          # Emulator discovery requires every defineString parameter to resolve.
          # This non-privileged placeholder exists only on the ephemeral runner.
          echo 'SUPER_ADMIN_UID=functions-ci-super-admin' > functions/.env.local
          chmod 600 functions/.env.local
      - name: Prepare the local Firestore emulator binary
        run: '"$RUNNER_TEMP/fn-firebase-tools/node_modules/.bin/firebase" setup:emulators:firestore'
      - name: Run the Functions suite against the demo-project emulators
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FUNCTIONS_EMULATOR_HOST: 127.0.0.1
          FUNCTIONS_EMULATOR_PORT: '5001'
          GCLOUD_PROJECT: demo-mindmate-mood-v2
        run: |
          FIREBASE_BIN="$RUNNER_TEMP/fn-firebase-tools/node_modules/.bin/firebase"
          "$FIREBASE_BIN" emulators:exec --config firebase.mood-v2.emulators.json --project demo-mindmate-mood-v2 --only auth,firestore,functions "cd functions && npm test"

  production-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_production_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - name: Restore signing material
        env:
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEY_PROPERTIES_B64" && test -n "$ANDROID_KEYSTORE_B64"
          echo "$ANDROID_KEY_PROPERTIES_B64" | base64 --decode > android/key.properties
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > android/release-upload.jks
      - run: flutter clean
      - run: flutter build appbundle --release --flavor production --dart-define=APP_ENV=production

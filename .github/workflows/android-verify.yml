name: Verify Android flavors

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_production_release:
        description: Build the signed production release (requires signing secrets)
        required: false
        type: boolean
        default: false

jobs:
  staging-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - name: Install Android CMake
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location is unavailable}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$sdkmanager"

          for attempt in 1 2 3; do
            if yes | "$sdkmanager" --sdk_root="$sdk_root" --install "cmake;3.22.1" \
              && test -x "$sdk_root/cmake/3.22.1/bin/cmake"; then
              exit 0
            fi
            rm -rf "$sdk_root/cmake/3.22.1"
            sleep $((attempt * 5))
          done

          echo "Unable to install Android CMake 3.22.1 after three attempts." >&2
          exit 1
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=APP_ENV=staging
      - run: flutter clean
      - run: flutter build apk --debug --flavor staging --dart-define=APP_ENV=staging
      - name: Verify staging APK identity and permissions
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location is unavailable}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump badging build/app/outputs/flutter-apk/app-staging-debug.apk | grep "package: name='com.example.mind_mates.staging'"
          "$aapt" dump permissions build/app/outputs/flutter-apk/app-staging-debug.apk | grep 'android.permission.INTERNET'

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  production-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_production_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - name: Restore signing material
        env:
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEY_PROPERTIES_B64" && test -n "$ANDROID_KEYSTORE_B64"
          echo "$ANDROID_KEY_PROPERTIES_B64" | base64 --decode > android/key.properties
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > android/release-upload.jks
      - run: flutter clean
      - run: flutter build appbundle --release --flavor production --dart-define=APP_ENV=production
